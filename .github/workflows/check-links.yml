name: Weekly Link & Content Validator

on:
  schedule:
    - cron: '0 9 * * 1'   # Every Monday 9am UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  validate-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-fetch@3 cheerio

      - name: Run link validator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/validate-links.js

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: link-validation-report
          path: link-report.md
          retention-days: 30

      - name: Fail if critical issues found
        run: |
          if grep -q "🔴 BROKEN" link-report.md; then
            echo "Critical link issues found — see link-report.md artifact"
            exit 1
          fi
